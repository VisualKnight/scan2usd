<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan2USD · 3D gallery</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: #1e293b; background: #f8fafc; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 28px 24px 48px; }
  h1 { margin: 0 0 4px; font-size: 28px; } .muted { color: #64748b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
  model-viewer { width: 100%; height: 320px; background: linear-gradient(#fff, #eef2f7); }
  .meta { padding: 10px 14px 14px; } .meta h3 { margin: 0 0 2px; font-size: 16px; }
  .meta p { margin: 4px 0; font-size: 13px; color: #64748b; }
  label { font-size: 13px; cursor: pointer; user-select: none; }
</style></head>
<body><div class="wrap">
<h1>Scan2USD · 3D gallery</h1>
<p class="muted">Drag to orbit, scroll to zoom. Tick "collision" to see the convex pieces the physics engine uses.
<a href="../overview.html">Back to the overview</a> · <a href="../library/index.html">USD asset library</a></p>
<div class="grid" id="grid"></div>
</div>
<script>
const items = [{"slug": "speckled_mug", "title": "Speckled mug", "caption": "78 synthetic photos \u2192 COLMAP \u2192 Scan2USD, scaled by the ColorChecker, texture baked (0.8 mm accuracy)", "mass_g": 436.5, "hulls": 32, "size_cm": "8.8 \u00d7 11.6 \u00d7 9.6"}, {"slug": "buddha_head", "title": "Buddha head (real photos)", "caption": "67 real photos (AliceVision dataset, CC-BY 4.0)", "mass_g": 4623.8, "hulls": 21, "size_cm": "15.2 \u00d7 16.2 \u00d7 20.0"}, {"slug": "cod_holder", "title": "Controller holder (own phone photos)", "caption": "81 iPhone photos; scaled from one tape measurement, measured mass, round base fitted as a cylinder", "mass_g": 528.0, "hulls": 64, "size_cm": "10.1 \u00d7 10.8 \u00d7 21.0"}, {"slug": "controller", "title": "Game controller (own phone photos)", "caption": "78 + 38 iPhone photos in two passes, merged by similarity ICP; measured mass", "mass_g": 243.0, "hulls": 39, "size_cm": "14.6 \u00d7 13.5 \u00d7 5.6"}, {"slug": "schleich_lion_action_figure", "title": "Lion figure", "caption": "Google Scanned Objects (CC-BY 4.0): 4K scanned texture, 32 convex colliders", "mass_g": 54.6, "hulls": 32, "size_cm": "11.5 \u00d7 4.2 \u00d7 7.0"}, {"slug": "womens_bluefish_2eye_boat_shoe_in_tan", "title": "Boat shoe", "caption": "Google Scanned Objects (CC-BY 4.0)", "mass_g": 652.7, "hulls": 32, "size_cm": "24.9 \u00d7 9.0 \u00d7 9.0"}, {"slug": "ace_coffee_mug_kristen_16_oz_cup", "title": "Printed mug", "caption": "Google Scanned Objects (CC-BY 4.0)", "mass_g": 466.0, "hulls": 32, "size_cm": "12.6 \u00d7 9.1 \u00d7 13.5"}];
const grid = document.getElementById('grid');
for (const it of items) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <model-viewer src="${it.slug}.glb" camera-controls auto-rotate shadow-intensity="1" exposure="1.05"
      environment-image="neutral" alt="${it.title}"></model-viewer>
    <div class="meta"><h3>${it.title}</h3><p>${it.caption}</p>
      <p>${it.size_cm} cm · ${it.mass_g} g · ${it.hulls} convex colliders</p>
      <label><input type="checkbox"> collision</label></div>`;
  const mv = card.querySelector('model-viewer');
  card.querySelector('input').addEventListener('change', e => {
    mv.src = e.target.checked ? `${it.slug}_hulls.glb` : `${it.slug}.glb`;
  });
  grid.appendChild(card);
}
</script></body></html>
