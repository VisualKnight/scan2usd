<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" font-family="'Segoe Print', 'Comic Sans MS', cursive">
  <defs>
    <!-- Slight wobble so lines look marker-drawn -->
    <filter id="marker" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1d4ed8" stroke-width="1.6"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#15803d" stroke-width="1.6"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#b91c1c" stroke-width="1.6"/>
    </marker>
    <!-- UML component icon -->
    <g id="cmp"><rect x="0" y="0" width="14" height="16" fill="none" stroke="#334155" stroke-width="1.2"/><rect x="-4" y="3" width="8" height="3" fill="#fff" stroke="#334155" stroke-width="1.1"/><rect x="-4" y="9" width="8" height="3" fill="#fff" stroke="#334155" stroke-width="1.1"/></g>
  </defs>

  <rect width="1120" height="800" fill="#fbfbf7"/>
  <text x="24" y="40" font-size="22" fill="#1e293b">Scan2USD · how the code fits together</text>
  <text x="24" y="62" font-size="12.5" fill="#64748b">UML-ish component view · blue = calls · green = data in · red = data out</text>

  <g filter="url(#marker)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Actor -->
    <g stroke="#1e293b" stroke-width="2" fill="none">
      <circle cx="52" cy="104" r="10"/><path d="M52,114 V140 M36,124 H68 M52,140 L40,160 M52,140 L64,160"/>
    </g>

    <!-- CLI and demo -->
    <rect x="110" y="96" width="160" height="58" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <rect x="110" y="200" width="160" height="58" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>

    <!-- Orchestrator -->
    <rect x="340" y="88" width="740" height="74" rx="8" fill="#e0f2fe" stroke="#1e293b" stroke-width="2.2"/>

    <!-- Stage modules -->
    <rect x="320" y="240" width="140" height="84" rx="6" fill="#fef9c3" stroke="#1e293b" stroke-width="2"/>
    <rect x="478" y="240" width="140" height="84" rx="6" fill="#fef9c3" stroke="#1e293b" stroke-width="2"/>
    <rect x="636" y="240" width="140" height="84" rx="6" fill="#fef9c3" stroke="#1e293b" stroke-width="2"/>
    <rect x="794" y="240" width="140" height="84" rx="6" fill="#fef9c3" stroke="#1e293b" stroke-width="2"/>
    <rect x="952" y="240" width="140" height="118" rx="6" fill="#fef9c3" stroke="#1e293b" stroke-width="2"/>
    <rect x="964" y="300" width="116" height="48" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>

    <!-- Inputs (documents) -->
    <path d="M20,330 H180 V378 Q140,366 100,378 Q60,390 20,378 Z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <path d="M20,420 H180 V468 Q140,456 100,468 Q60,480 20,468 Z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>

    <!-- Outputs (documents) -->
    <path d="M794,450 H934 V498 Q899,486 864,498 Q829,510 794,498 Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <path d="M952,450 H1092 V498 Q1057,486 1022,498 Q987,510 952,498 Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <path d="M478,450 H618 V498 Q583,486 548,498 Q513,510 478,498 Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <rect x="636" y="450" width="140" height="50" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>

    <!-- Future (ghost) -->
    <rect x="794" y="550" width="140" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <rect x="952" y="550" width="140" height="68" rx="6" fill="#e0f2fe" stroke="#1e293b" stroke-width="2"/>
    <rect x="636" y="350" width="140" height="56" rx="6" fill="#fef9c3" stroke="#1e293b" stroke-width="2"/>
    <rect x="636" y="550" width="140" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <rect x="478" y="552" width="140" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <rect x="250" y="600" width="150" height="54" rx="6" fill="#fef9c3" stroke="#1e293b" stroke-width="2"/>
    <rect x="20" y="512" width="160" height="58" rx="6" fill="#fef9c3" stroke="#1e293b" stroke-width="2"/>
    <path d="M20,604 H180 V650 Q140,638 100,650 Q60,662 20,650 Z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>

    <!-- Calls -->
    <g stroke="#1d4ed8" stroke-width="2" fill="none">
      <path d="M74,125 H106" marker-end="url(#arrow)"/>
      <path d="M270,125 H336" marker-end="url(#arrow)"/>
      <path d="M190,154 V196" marker-end="url(#arrow)"/>
      <path d="M390,162 V236" marker-end="url(#arrow)"/>
      <path d="M548,162 V236" marker-end="url(#arrow)"/>
      <path d="M706,162 V236" marker-end="url(#arrow)"/>
      <path d="M864,162 V236" marker-end="url(#arrow)"/>
      <path d="M1022,162 V236" marker-end="url(#arrow)"/>
    </g>
