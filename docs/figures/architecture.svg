<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="'Segoe Print', 'Comic Sans MS', cursive" role="img" aria-label="Scan2USD system view">
  <defs>
    <filter id="arch_rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <marker id="arch_a_cap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#0e7490" stroke-width="1.8"/></marker>
    <marker id="arch_a_bld" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6d28d9" stroke-width="1.8"/></marker>
    <marker id="arch_a_ver" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#047857" stroke-width="1.8"/></marker>
    <marker id="arch_a_use" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#c2410c" stroke-width="1.8"/></marker>
    <marker id="arch_a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e293b" stroke-width="1.8"/></marker>
    <marker id="arch_a_soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#64748b" stroke-width="1.8"/></marker>
  </defs>
  <rect width="1180" height="640" fill="#fbfbf7"/>
  <text x="24" y="42" font-size="24" fill="#1e293b">Scan2USD · system view</text>
  <text x="24" y="68" font-size="13" fill="#64748b">phone photos in, one physics-ready OpenUSD asset out; every simulator and renderer reads the same file</text>
  <rect x="20" y="96" width="210" height="490" rx="14" fill="#ecfeff" opacity="0.7"/>
  <text x="34" y="122" font-size="13" fill="#0e7490" text-anchor="start" font-weight="bold">1 · CAPTURE</text>
  <rect x="250" y="96" width="300" height="490" rx="14" fill="#f5f3ff" opacity="0.7"/>
  <text x="264" y="122" font-size="13" fill="#6d28d9" text-anchor="start" font-weight="bold">2 · BUILD</text>
  <rect x="570" y="96" width="230" height="490" rx="14" fill="#ecfdf5" opacity="0.7"/>
  <text x="584" y="122" font-size="13" fill="#047857" text-anchor="start" font-weight="bold">3 · VERIFY</text>
  <rect x="820" y="96" width="340" height="490" rx="14" fill="#fff7ed" opacity="0.7"/>
  <text x="834" y="122" font-size="13" fill="#c2410c" text-anchor="start" font-weight="bold">4 · USE</text>
  <g class="node" data-k="photos" data-stage="cap" tabindex="0">
  <rect x="36" y="150" width="178" height="100" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="50" y="176" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">Phone photos</text>
  <text x="50" y="198" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">60–150 shots</text>
  <text x="50" y="217" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">of an everyday object</text>
  </g>
  <g class="node" data-k="refs" data-stage="cap" tabindex="0">
  <rect x="36" y="274" width="178" height="100" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="50" y="300" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">References</text>
  <text x="50" y="322" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">color chart · weight</text>
  <text x="50" y="341" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">tape (optional)</text>
  </g>
  <g class="node" data-k="guide" data-stage="cap" tabindex="0">
  <rect x="36" y="444" width="178" height="100" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="50" y="470" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">Capture guide</text>
  <text x="50" y="492" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">which photos</text>
  <text x="50" y="511" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">to take next</text>
  </g>
  <g class="node" data-k="pipeline" data-stage="bld" tabindex="0">
  <rect x="266" y="150" width="268" height="210" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="280" y="176" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">scan2usd pipeline</text>
  <text x="280" y="198" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">reconstruct (COLMAP → mesh)</text>
  <text x="280" y="217" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">clean, bake textures</text>
  <text x="280" y="236" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">calibrate color, metric scale</text>
  <text x="280" y="255" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">convex hulls, mass, inertia</text>
  <text x="280" y="274" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">joints for articulated objects</text>
  </g>
  <g class="node" data-k="asset" data-stage="bld" tabindex="0">
  <rect x="266" y="392" width="268" height="152" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="280" y="418" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">OpenUSD asset</text>
  <text x="280" y="440" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">look · colliders · mass</text>
  <text x="280" y="459" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">+ tested grasps, uncertainty,</text>
  <text x="280" y="478" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">   Gaussian-splat look</text>
  <text x="280" y="497" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">one file every engine reads</text>
  </g>
  <g class="node" data-k="validator" data-stage="ver" tabindex="0">
  <rect x="600" y="150" width="184" height="100" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="614" y="176" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">Validator</text>
  <text x="614" y="198" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">33 checks on the</text>
  <text x="614" y="217" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">written file</text>
  </g>
  <g class="node" data-k="truth" data-stage="ver" tabindex="0">
  <rect x="600" y="272" width="184" height="100" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="614" y="298" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">Ground truth</text>
  <text x="614" y="320" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">surface error vs</text>
  <text x="614" y="339" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">true meshes</text>
  </g>
  <g class="node" data-k="realcheck" data-stage="ver" tabindex="0">
  <rect x="600" y="444" width="184" height="100" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="614" y="470" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">Real-world check</text>
  <text x="614" y="492" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">scan vs the real</text>
  <text x="614" y="511" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">objects, posed</text>
  </g>
  <g class="node" data-k="physics" data-stage="use" tabindex="0">
  <rect x="836" y="150" width="308" height="118" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="850" y="176" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">Physics + robots</text>
  <text x="850" y="198" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">MuJoCo · Isaac Sim · Isaac Lab</text>
  <text x="850" y="217" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">Franka Panda · Shadow Hand</text>
  <text x="850" y="236" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">pick, place, a learned policy</text>
  </g>
  <g class="node" data-k="perception" data-stage="use" tabindex="0">
  <rect x="836" y="288" width="308" height="100" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="850" y="314" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">Perception</text>
  <text x="850" y="336" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">Replicator synthetic data →</text>
  <text x="850" y="355" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">detector → pose → pick</text>
  </g>
  <g class="node" data-k="render" data-stage="use" tabindex="0">
  <rect x="836" y="408" width="308" height="136" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2.2" filter="url(#arch_rough)"/>
  <text x="850" y="434" font-size="16" fill="#1e293b" text-anchor="start" font-weight="bold">Rendering + library</text>
  <text x="850" y="456" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">Isaac Sim RTX path tracing</text>
  <text x="850" y="475" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">Unreal Engine 5.8 (MegaLights)</text>
  <text x="850" y="494" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal">USD asset library, 3D gallery</text>
  </g>
  <path d="M214,200 C240,200 244,230 262,230" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arch_a_cap)"/>
  <path d="M214,324 C240,324 244,296 262,292" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arch_a_cap)"/>
  <path d="M400,360 L400,388" fill="none" stroke="#6d28d9" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arch_a_bld)"/>
  <path d="M534,430 L574,430 M574,200 L574,494" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M574,200 L596,200" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arch_a_ver)"/>
  <path d="M574,322 L596,322" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arch_a_ver)"/>
  <path d="M574,494 L596,494" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arch_a_ver)"/>
  <path d="M400,544 L400,566 L812,566 L812,209" fill="none" stroke="#c2410c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M812,209 L832,209" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arch_a_use)"/>
  <path d="M812,338 L832,338" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arch_a_use)"/>
  <path d="M812,476 L832,476" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arch_a_use)"/>
  <text x="606" y="584" font-size="12" fill="#c2410c" text-anchor="start" font-weight="normal">same file in every engine</text>
  <path d="M266,494 L218,494" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arch_a_cap)"/>
  <path d="M30,494 L30,206 L32,206" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arch_a_cap)"/>
  <path d="M36,494 L30,494" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-dasharray="8 6"/>
  <text x="222" y="482" font-size="11" fill="#0e7490" text-anchor="start" font-weight="normal">unknowns</text>
  <text x="1156" y="622" font-size="11" fill="#64748b" text-anchor="end">module-level map: README, "What it does"</text>
</svg>
