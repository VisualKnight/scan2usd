    <g stroke="#15803d" stroke-width="2" fill="none">
      <path d="M182,352 C240,352 270,300 316,290" marker-end="url(#arrowg)"/>
      <path d="M182,444 H548 V328" marker-end="url(#arrowg)"/>
      <path d="M150,258 C150,290 120,300 110,326" stroke-dasharray="6 5" marker-end="url(#arrowg)"/>
      <path d="M100,602 V574" marker-end="url(#arrowg)"/>
      <path d="M182,628 H194 V478 L176,472" marker-end="url(#arrowg)"/>
      <path d="M22,520 C6,480 6,400 18,372" marker-end="url(#arrowg)"/>
      <path d="M182,642 C210,640 225,632 246,628" marker-end="url(#arrowg)"/>
    </g>
    <!-- Data out -->
    <g stroke="#b91c1c" stroke-width="2" fill="none">
      <path d="M864,324 V446" marker-end="url(#arrowr)"/>
      <path d="M1022,358 V446" marker-end="url(#arrowr)"/>
      <path d="M636,475 H622" marker-end="url(#arrowr)"/>
      <path d="M864,502 V546" stroke="#7c3aed" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
      <path d="M936,500 C960,520 990,530 1010,546" marker-end="url(#arrowr)"/>
      <path d="M812,506 C795,525 785,535 774,546" marker-end="url(#arrowr)"/>
      <path d="M806,504 C800,522 760,528 700,528 H560 Q548,528 548,548" marker-end="url(#arrowr)"/>
      <path d="M776,398 C790,420 800,435 812,448" marker-end="url(#arrowr)"/>
    </g>
