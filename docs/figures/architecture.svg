      <path d="M706,348 V328" marker-end="url(#arrow)"/>
      <path d="M778,362 C800,350 820,340 840,328" marker-end="url(#arrow)"/>
    </g>
  </g>

  <!-- Labels (unfiltered for legibility) -->
  <g fill="#1e293b" font-size="13">
    <text x="52" y="178" text-anchor="middle" font-size="12">you</text>

    <use href="#cmp" x="246" y="104"/>
    <text x="122" y="120" font-size="15">cli.py</text>
    <text x="122" y="141" font-size="11" fill="#475569">scan · build · articulate</text>
    <use href="#cmp" x="246" y="208"/>
    <text x="122" y="224" font-size="15">demo.py</text>
    <text x="122" y="245" font-size="11" fill="#475569">synthetic mug "scan"</text>

    <use href="#cmp" x="1052" y="96"/>
    <text x="356" y="112" font-size="11.5" fill="#475569">«orchestrator»</text>
    <text x="356" y="136" font-size="16">pipeline.py · build_asset()</text>
    <text x="356" y="154" font-size="11.5" fill="#475569">runs the stages in order, times each one, writes build_report.json</text>

    <g font-size="11.5" fill="#1d4ed8">
      <text x="396" y="206">1. load + clean</text>
      <text x="554" y="206">2. calibrate</text>
      <text x="712" y="206">3. hulls + mass</text>
      <text x="870" y="206">4. write</text>
      <text x="1028" y="206">5. check</text>
    </g>

    <g font-size="14.5">
      <text x="332" y="262">mesh_ops.py</text>
      <text x="490" y="262">color.py</text>
      <text x="648" y="262">physics.py</text>
      <text x="806" y="262">usd_io.py</text>
      <text x="964" y="262">validate.py</text>
    </g>
    <g font-size="10.5" fill="#475569">
      <text x="332" y="281">clean · Z-up · meters</text><text x="332" y="296">decimate · bake maps</text><text x="332" y="315" fill="#7c3aed">trimesh, pymeshlab</text>
      <text x="490" y="281">CCM / gray card</text><text x="490" y="296">CIEDE2000</text><text x="490" y="315" fill="#7c3aed">numpy</text>
      <text x="648" y="281">convex hulls</text><text x="648" y="296">mass · inertia</text><text x="648" y="315" fill="#7c3aed">CoACD, manifold3d</text>
      <text x="806" y="281">UsdGeom · UsdShade</text><text x="806" y="296">UsdPhysics · glTF</text><text x="806" y="315" fill="#7c3aed">usd-core (pxr)</text>
      <text x="964" y="281">33 checks on the file</text>
      <text x="972" y="318" font-size="13" fill="#1e293b">simulate.py</text><text x="972" y="337" fill="#7c3aed">MuJoCo drop tests</text>
    </g>

    <g font-size="12.5">
      <text x="30" y="350">scan mesh</text><text x="30" y="367" font-size="10.5" fill="#475569">.ply · .obj · .glb</text>
      <text x="30" y="440">chart / gray-card</text><text x="30" y="457" font-size="10.5" fill="#475569">photo</text>
      <text x="804" y="470">asset .usd(a)</text><text x="804" y="487" font-size="10.5" fill="#475569">+ .glb</text>
      <text x="962" y="470">validation.md</text><text x="962" y="487" font-size="10.5" fill="#475569">build_report.json</text>
      <text x="488" y="470">preview.png</text><text x="488" y="487" font-size="10.5" fill="#475569">no 3D app needed</text>
      <text x="648" y="472">preview.py</text><text x="648" y="490" font-size="10.5" fill="#475569">numpy rasterizer</text>
    </g>
    <text x="966" y="402" font-size="10.5" fill="#7c3aed">reads the</text>
    <text x="966" y="416" font-size="10.5" fill="#7c3aed">file back</text>
    <use href="#cmp" x="160" y="518"/>
    <text x="32" y="532" font-size="14.5">reconstruct.py</text>
    <text x="32" y="548" font-size="10.5" fill="#475569">photos → mesh, Z-up</text>
    <text x="32" y="563" font-size="10.5" fill="#7c3aed">COLMAP (CUDA)</text>
    <text x="30" y="624" font-size="12.5">photos</text>
    <text x="30" y="640" font-size="10.5" fill="#475569">phone · Blender renders</text>
    <use href="#cmp" x="914" y="556"/>
    <text x="806" y="572" font-size="14.5">evaluate.py</text>
    <text x="806" y="590" font-size="10.5" fill="#475569">scores vs ground truth</text>
    <use href="#cmp" x="380" y="606"/>
    <text x="262" y="622" font-size="14">chart.py</text>
    <text x="258" y="640" font-size="10" fill="#475569">chart: color + metric scale</text>
    <text x="964" y="572" font-size="14">Isaac Sim 6</text>
    <text x="964" y="590" font-size="10.5" fill="#475569">PhysX · RTX path tracing</text>
    <text x="964" y="606" font-size="10.5" fill="#7c3aed">→ synth data, sim2real</text>
    <use href="#cmp" x="756" y="356"/>
    <text x="646" y="372" font-size="12.5">articulation.py</text>
    <text x="648" y="390" font-size="10.5" fill="#475569">split + hinge joint</text>
    <use href="#cmp" x="756" y="556"/>
    <text x="648" y="572" font-size="14">mjcf.py</text>
    <use href="#cmp" x="598" y="558"/>
    <text x="490" y="574" font-size="14">library.py</text>
    <text x="490" y="592" font-size="10.5" fill="#475569">payloads · variants</text>
    <text x="648" y="590" font-size="10.5" fill="#475569">Panda · bin · robustness</text>

    <!-- Sticky note -->
    <g transform="rotate(-2 330 540)">
      <rect x="250" y="515" width="200" height="62" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
      <text x="262" y="538" font-size="11.5">each stage = one module,</text>
      <text x="262" y="555" font-size="11.5">plain functions in, data out</text>
      <text x="262" y="571" font-size="11.5" fill="#92400e">→ easy to test (102 tests)</text>
    </g>
  </g>
  <g filter="url(#marker)" stroke-linecap="round" stroke-linejoin="round">
