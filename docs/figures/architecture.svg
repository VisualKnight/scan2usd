  <g fill="#1e293b" font-size="13">
    <text x="252" y="700" font-size="13" fill="#475569">assets that know what they don't know</text>
    <text x="104" y="738" font-size="10.5" fill="#15803d">shot list: take</text>
    <text x="104" y="752" font-size="10.5" fill="#15803d">these 8 photos</text>
    <use href="#cmp" x="386" y="720"/>
    <text x="262" y="736" font-size="14">guide.py</text>
    <text x="262" y="754" font-size="10.5" fill="#475569">what to shoot next</text>
    <use href="#cmp" x="558" y="720"/>
    <text x="434" y="736" font-size="14">uncertainty.py</text>
    <text x="434" y="754" font-size="10.5" fill="#475569">seen · guessed · sealed</text>
