[project]
name = "scan2usd"
version = "0.1.0"
description = "Scan-to-Sim asset pipeline: turns real-world captures into physics-ready OpenUSD assets for robotics simulation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Yibo Liu" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.4",
    "networkx>=3.0",
    "rtree>=1.2",
    "shapely>=2.0",
    "manifold3d>=2.5",
    "fast-simplification>=0.1.7",
    "pymeshlab>=2023.12",
    "coacd>=1.0.5",
    "usd-core>=24.8",
    "mujoco>=3.2",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scan2usd = "scan2usd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scan2usd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
