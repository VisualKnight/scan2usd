name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries (pymeshlab / OpenCV)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libgomp1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
